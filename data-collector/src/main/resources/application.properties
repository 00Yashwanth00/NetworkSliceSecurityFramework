# MMT Studio Data Collector Configuration

# Base URL of the MMT Studio Core Web UI/API
mmt.core.baseUrl=http://localhost:5000

# How often to poll the APIs and write CSV rows (in seconds)
collector.intervalSeconds=3

# Directory to store the output CSV files
collector.outputDir=./collected-data

# Label for the current collection session (e.g. normal, request_bombing, ddos, qos_degradation)
collector.sessionLabel=normal

# Time window (seconds) to use for calculating raw KPI rates
collector.kpiRawWindowSec=3

# Time window (seconds) for NWDAF analytics API
collector.nwdafWindowSec=30

ml.riskServiceUrl=http://localhost:5002/api/v1/evaluate-risk

# Redis Message Broker
redis.host=localhost
redis.port=6379
redis.stream=telemetry.network
redis.enabled=true
